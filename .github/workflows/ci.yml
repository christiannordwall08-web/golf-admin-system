name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Databastesterna startar sin egen engångs-PostgreSQL (npm-paketet embedded-postgres), ingen tjänst behövs.
      - run: npm test
      # Bygget kräver inga hemligheter: miljövariabler valideras först vid körning.
      - run: npm run build
